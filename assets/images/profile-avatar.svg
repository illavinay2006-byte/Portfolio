<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />
  <rect width="396" height="396" x="2" y="2" rx="34" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Abstract Geometry & Grid -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="200" cy="200" r="115" fill="url(#accentGrad)" stroke="url(#ringGrad)" stroke-width="2" />

  <!-- Code Bracket Symbols -->
  <path d="M 120 170 L 95 200 L 120 230" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 280 170 L 305 200 L 280 230" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Monogram -->
  <text x="200" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="52" fill="#f8fafc" text-anchor="middle" letter-spacing="2">IVK</text>
  <text x="200" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="3">DEVELOPER</text>

  <!-- Status Indicator Dot -->
  <circle cx="260" cy="145" r="7" fill="#10b981" filter="url(#glow)" />
  <circle cx="260" cy="145" r="4" fill="#ecfdf5" />

  <!-- Tech tags inside border -->
  <rect x="130" y="320" width="140" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="200" y="341" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle">CSE 3rd Year</text>
</svg>

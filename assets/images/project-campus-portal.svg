  <rect x="230" y="170" width="150" height="75" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <text x="246" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94a3b8">Total Enrolled</text>
  <text x="246" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="22" fill="#f8fafc">1,240</text>

  <rect x="400" y="170" width="150" height="75" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />

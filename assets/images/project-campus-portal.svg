<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Window Container -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="40" y="40" width="720" height="44" rx="12" fill="#1e293b" />
  <circle cx="68" cy="62" r="6" fill="#ef4444" />
  <circle cx="88" cy="62" r="6" fill="#f59e0b" />
  <circle cx="108" cy="62" r="6" fill="#10b981" />
  <rect x="180" y="50" width="440" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="400" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">https://campus-portal.internal/dashboard</text>

  <!-- Sidebar -->
  <rect x="40" y="84" width="160" height="376" fill="#0b1329" stroke="#1e293b" stroke-width="1" />

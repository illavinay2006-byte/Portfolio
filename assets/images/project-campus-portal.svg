  <text x="96" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="12" fill="#38bdf8">Dashboard</text>
  <rect x="56" y="150" width="128" height="24" rx="6" fill="transparent" />

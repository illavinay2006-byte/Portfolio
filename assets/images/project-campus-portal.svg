  <line x1="230" y1="335" x2="730" y2="335" stroke="#334155" stroke-width="1" />
  <text x="250" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#e2e8f0">CSE-2022-041</text>
  <text x="360" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#e2e8f0">Ananya Sharma</text>
  <text x="500" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#e2e8f0">Sem V</text>
  <rect x="635" y="310" width="60" height="18" rx="4" fill="#065f46" />
  <text x="665" y="323" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" font-weight="700" fill="#a7f3d0" text-anchor="middle">ACTIVE</text>

  <line x1="230" y1="375" x2="730" y2="375" stroke="#334155" stroke-width="1" />
  <text x="250" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#e2e8f0">CSE-2022-089</text>
  <text x="360" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#e2e8f0">Kiran Varma</text>
  <text x="500" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#e2e8f0">Sem V</text>
  <rect x="635" y="350" width="60" height="18" rx="4" fill="#065f46" />
  <text x="665" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" font-weight="700" fill="#a7f3d0" text-anchor="middle">ACTIVE</text>
</svg>

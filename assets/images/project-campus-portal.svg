  <rect x="570" y="170" width="160" height="75" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <text x="586" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94a3b8">Active Sessions</text>

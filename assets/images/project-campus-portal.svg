  <text x="500" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="11" fill="#94a3b8">SEMESTER</text>
  <text x="640" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="11" fill="#94a3b8">STATUS</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1322" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad4)" />

  <!-- Window Container -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="40" y="40" width="720" height="44" rx="12" fill="#1e293b" />
  <circle cx="68" cy="62" r="6" fill="#ef4444" />
  <circle cx="88" cy="62" r="6" fill="#f59e0b" />
  <circle cx="108" cy="62" r="6" fill="#10b981" />
  <text x="400" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Academic Evaluation &amp; Grade Predictor — Java CLI &amp; GUI</text>

  <!-- Left Stats Block -->
  <rect x="70" y="110" width="280" height="320" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
  <text x="90" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Semester Summary</text>

  <rect x="90" y="170" width="240" height="48" rx="6" fill="#1e293b" />
  <text x="105" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94a3b8">Subject Count</text>
  <text x="105" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="14" fill="#38bdf8">6 Core Theory + 3 Labs</text>

  <rect x="90" y="230" width="240" height="48" rx="6" fill="#1e293b" />
  <text x="105" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94a3b8">Total Credits</text>
  <text x="105" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="14" fill="#818cf8">22 Credits Registered</text>

  <rect x="90" y="290" width="240" height="70" rx="6" fill="#1e293b" />
  <text x="105" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94a3b8">Core Algorithm</text>
  <text x="105" y="332" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">Weighted SGPA Calculation</text>
  <text x="105" y="348" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9ca3af">Credits * GradePoints / TotalCredits</text>

  <!-- Right Chart/Graphic View -->
  <rect x="370" y="110" width="360" height="320" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
  <text x="395" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Grade Distribution Matrix</text>

  <!-- Simulated Bar Graph -->
  <line x1="410" y1="380" x2="690" y2="380" stroke="#374151" stroke-width="1" />
  <line x1="410" y1="180" x2="410" y2="380" stroke="#374151" stroke-width="1" />

  <!-- Bar 1 -->
  <rect x="440" y="210" width="34" height="170" rx="4" fill="url(#barGrad)" />
  <text x="457" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">DSA</text>

  <!-- Bar 2 -->
  <rect x="495" y="240" width="34" height="140" rx="4" fill="url(#barGrad)" />
  <text x="512" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">DBMS</text>

  <!-- Bar 3 -->
  <rect x="550" y="220" width="34" height="160" rx="4" fill="url(#barGrad)" />
  <text x="567" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">OS</text>

  <!-- Bar 4 -->
  <rect x="605" y="200" width="34" height="180" rx="4" fill="url(#barGrad)" />
  <text x="622" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">OOP</text>

  <!-- Bar 5 -->
  <rect x="660" y="230" width="34" height="150" rx="4" fill="url(#barGrad)" />
  <text x="677" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">WT</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#181829" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad2)" />

  <!-- Code Editor Window -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="url(#codeGrad)" stroke="#374151" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="40" y="40" width="720" height="44" rx="12" fill="#1f2937" />
  <circle cx="68" cy="62" r="6" fill="#ef4444" />
  <circle cx="88" cy="62" r="6" fill="#f59e0b" />
  <circle cx="108" cy="62" r="6" fill="#10b981" />
  <rect x="150" y="49" width="180" height="26" rx="6" fill="#111827" />
  <text x="240" y="66" font-family="'JetBrains Mono', monospace" font-size="12" fill="#60a5fa" text-anchor="middle">api/v1/routes.js</text>

  <!-- Method Badges & Routes -->
  <rect x="70" y="110" width="660" height="48" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
  <rect x="85" y="122" width="60" height="24" rx="4" fill="#047857" />
  <text x="115" y="138" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#ecfdf5" text-anchor="middle">GET</text>
  <text x="160" y="139" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f3f4f6">/api/v1/tasks?status=active&amp;limit=10</text>
  <rect x="640" y="122" width="75" height="24" rx="4" fill="#064e3b" />
  <text x="677" y="138" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" fill="#34d399" text-anchor="middle">200 OK</text>

  <rect x="70" y="170" width="660" height="48" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
  <rect x="85" y="182" width="60" height="24" rx="4" fill="#1d4ed8" />
  <text x="115" y="198" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#eff6ff" text-anchor="middle">POST</text>
  <text x="160" y="199" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f3f4f6">/api/v1/tasks/dispatch</text>
  <rect x="640" y="182" width="75" height="24" rx="4" fill="#1e3a8a" />
  <text x="677" y="198" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" fill="#93c5fd" text-anchor="middle">201 Created</text>

  <!-- JSON Payload Response Display -->
  <rect x="70" y="235" width="660" height="200" rx="8" fill="#0a0e17" stroke="#27272a" stroke-width="1" />
  <text x="90" y="265" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9ca3af">Response Body (JSON):</text>
  <text x="90" y="295" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e5e7eb">{</text>
  <text x="115" y="320" font-family="'JetBrains Mono', monospace" font-size="13" fill="#93c5fd">  "success"<text fill="#e5e7eb">: </text><text fill="#34d399">true</text><text fill="#e5e7eb">,</text></text>
  <text x="115" y="345" font-family="'JetBrains Mono', monospace" font-size="13" fill="#93c5fd">  "statusCode"<text fill="#e5e7eb">: </text><text fill="#f59e0b">200</text><text fill="#e5e7eb">,</text></text>
  <text x="115" y="370" font-family="'JetBrains Mono', monospace" font-size="13" fill="#93c5fd">  "message"<text fill="#e5e7eb">: </text><text fill="#fca5a5">"Workflow pipeline authenticated &amp; executed"</text><text fill="#e5e7eb">,</text></text>
  <text x="115" y="395" font-family="'JetBrains Mono', monospace" font-size="13" fill="#93c5fd">  "engine"<text fill="#e5e7eb">: </text><text fill="#fca5a5">"Node.js Express &amp; Token Auth"</text></text>
  <text x="90" y="420" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e5e7eb">}</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0c1322" />
    </linearGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="640" fill="url(#certBg2)" />
  
  <!-- Outer Decorative Border -->
  <rect x="25" y="25" width="850" height="590" rx="8" fill="none" stroke="url(#cyanBorder)" stroke-width="2" />
  <rect x="35" y="35" width="830" height="570" rx="6" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="6 6" />

  <!-- Seal / Emblem -->
  <circle cx="450" cy="110" r="36" fill="#1e293b" stroke="url(#cyanBorder)" stroke-width="2" />
  <text x="450" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="800" font-size="20" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>

  <!-- Certificate Headings -->
  <text x="450" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="26" fill="#f8fafc" text-anchor="middle" letter-spacing="4">CERTIFICATE OF RECOGNITION</text>
  <text x="450" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="2">PROUDLY PRESENTED TO</text>

  <!-- Recipient Name -->
  <text x="450" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="800" font-size="34" fill="#818cf8" text-anchor="middle">Illa Vinay Kumar</text>
  <line x1="250" y1="285" x2="650" y2="285" stroke="#334155" stroke-width="1.5" />

  <!-- Course Description -->
  <text x="450" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" fill="#cbd5e1" text-anchor="middle">in appreciation for outstanding completion of technical modules in</text>
  <text x="450" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="24" fill="#f1f5f9" text-anchor="middle">Modern Web Technologies &amp; JavaScript (ES6+)</text>
  <text x="450" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">DOM Manipulation, Asynchronous Programming, Responsive Layouts, and CSS3 Engineering</text>

  <!-- Verification Details Box -->
  <rect x="220" y="440" width="460" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="245" y="470" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Credential ID:</text>
  <text x="355" y="470" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" fill="#818cf8">[Placeholder: Enter Certificate ID]</text>

  <!-- Footer Signatures -->
  <line x1="160" y1="550" x2="340" y2="550" stroke="#64748b" stroke-width="1" />
  <text x="250" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Certifying Organization</text>

  <line x1="560" y1="550" x2="740" y2="550" stroke="#64748b" stroke-width="1" />
  <text x="650" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Instructor / Program Director</text>
</svg>

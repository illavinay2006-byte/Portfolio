<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="640" fill="url(#certBg)" />
  
  <!-- Outer Decorative Border -->
  <rect x="25" y="25" width="850" height="590" rx="8" fill="none" stroke="url(#goldBorder)" stroke-width="2" />
  <rect x="35" y="35" width="830" height="570" rx="6" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="8 6" />

  <!-- Corner Flourishes -->
  <path d="M 45 65 L 65 45 M 45 45 L 85 45 M 45 45 L 45 85" stroke="url(#goldBorder)" stroke-width="2" fill="none" />
  <path d="M 855 65 L 835 45 M 855 45 L 815 45 M 855 45 L 855 85" stroke="url(#goldBorder)" stroke-width="2" fill="none" />
  <path d="M 45 575 L 65 595 M 45 595 L 85 595 M 45 595 L 45 555" stroke="url(#goldBorder)" stroke-width="2" fill="none" />
  <path d="M 855 575 L 835 595 M 855 595 L 815 595 M 855 595 L 855 555" stroke="url(#goldBorder)" stroke-width="2" fill="none" />

  <!-- Seal / Emblem -->
  <circle cx="450" cy="110" r="36" fill="url(#badgeGrad)" />
  <circle cx="450" cy="110" r="30" fill="#090d16" stroke="url(#goldBorder)" stroke-width="1.5" />
  <text x="450" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="800" font-size="22" fill="#fbbf24" text-anchor="middle">★</text>

  <!-- Certificate Headings -->
  <text x="450" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Georgia, serif" font-weight="700" font-size="26" fill="#f8fafc" text-anchor="middle" letter-spacing="4">CERTIFICATE OF COMPLETION</text>
  <text x="450" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="2">THIS ACKNOWLEDGES THAT</text>

  <!-- Recipient Name -->
  <text x="450" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="800" font-size="34" fill="#38bdf8" text-anchor="middle">Illa Vinay Kumar</text>
  <line x1="250" y1="285" x2="650" y2="285" stroke="#475569" stroke-width="1.5" />

  <!-- Course Description -->
  <text x="450" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" fill="#cbd5e1" text-anchor="middle">has successfully completed technical coursework and practical evaluation in</text>
  <text x="450" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="24" fill="#f1f5f9" text-anchor="middle">Python &amp; Modern Backend Web Development</text>
  <text x="450" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Covering Object-Oriented Design, Flask Framework, RESTful APIs, and Database Integration</text>

  <!-- Verification Details Box -->
  <rect x="220" y="440" width="460" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="245" y="470" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Credential ID:</text>
  <text x="355" y="470" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" fill="#38bdf8">[Placeholder: Enter Certificate ID]</text>

  <!-- Footer Signatures -->
  <line x1="160" y1="550" x2="340" y2="550" stroke="#64748b" stroke-width="1" />
  <text x="250" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Issuing Platform / Organization</text>

  <line x1="560" y1="550" x2="740" y2="550" stroke="#64748b" stroke-width="1" />
  <text x="650" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Authorized Academic Verifier</text>
</svg>
